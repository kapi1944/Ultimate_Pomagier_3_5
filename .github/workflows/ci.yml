name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalacja zależności
        run: npm ci
      - name: Testy
        run: npm test
      - name: Testy przeglądarkowe w zainstalowanym Chrome
        run: npm run test:e2e -- testy/importMailaSzczegolow.przegladarka.test.mjs testy/checklistyPaczek.przegladarka.test.mjs testy/backupMigracjiE4.przegladarka.test.mjs
      - name: Testy magazynu danych i bramy E4
        run: node --test testy/magazynWspolnychDanych.test.mjs testy/bramaHttps.test.mjs
      - name: Testy konfiguracji desktopowej
        run: npm run test:desktop
      - name: Testy rejestru i dystrybucji
        run: npm run test:dystrybucja
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
