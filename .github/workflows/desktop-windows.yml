name: Instalator Windows

on:
  workflow_call:
    inputs:
      podpisane:
        type: boolean
        required: true
      kanal:
        type: string
        default: stabilny
      opis_zmian:
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      podpisane:
        description: Podpisane wydanie (wybierz tag vX.Y.Z)
        type: boolean
        default: false
      kanal:
        description: Kanał podpisanego wydania (obie wersje używają X.Y.Z)
        type: choice
        options: [testowy, stabilny]
        default: testowy
      opis_zmian:
        description: Rzeczywiste informacje o zmianach
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-wydanie-${{ github.event_name == 'pull_request' && github.ref || 'publikacja' }}
  cancel-in-progress: false

jobs:
  instalator:
    runs-on: windows-2022
    env:
      POMAGIER_KANAL_AKTUALIZACJI: ${{ inputs.kanal || 'stabilny' }}
      POMAGIER_OPIS_ZMIAN: ${{ inputs.opis_zmian }}
    steps:
      - name: Pobranie źródeł
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Konfiguracja Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Instalacja zależności
        run: npm ci
      - name: Kontrola podpisywanego wydania z main
        if: ${{ inputs.podpisane }}
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Wydanie musi pochodzić z main.' }
          if ($env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$') { throw 'Wybierz tag vX.Y.Z.' }
      - name: Testy aplikacji
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Testy Launchera
        run: npm run test:launcher
      - name: Testy pakietowania i aktualizacji
        run: npm run test:desktop
      - name: Testy dystrybucji i ochrony danych
        run: npm run test:dystrybucja
      - name: Formatowanie kodu Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build testowego instalatora (aktualizacje wyłączone)
        if: ${{ !inputs.podpisane }}
        run: npm run desktop:build
      - name: Build podpisanego instalatora wybranego kanału
        if: ${{ inputs.podpisane }}
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:release
      - name: Zachowanie instalatora i sum kontrolnych
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Pomagier-Windows-${{ github.run_number }}
          path: |
            wydanie-desktop/testowe/Ultimate_Pomagier_*.exe*
            wydanie-desktop/testowe/wersja.json
            wydanie-desktop/podpisane/Ultimate_Pomagier_*.exe*
            wydanie-desktop/podpisane/wersja.json
            wydanie-desktop/podpisane/latest.json
            wydanie-desktop/podpisane/windows-*.json
            wydanie-desktop/podpisane/wydanie-windows.json
          if-no-files-found: error
          retention-days: 30
